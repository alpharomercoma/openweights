name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # llama.cpp is a pinned submodule; the native build needs it present.
          submodules: recursive
          # The whole history, because the version code is the commit count. The default is
          # a single commit, which would make that count 1 here and a hundred and something
          # on a laptop: the same source producing two different version codes, with the
          # wrong one coming from the machine that builds what ships. The build now refuses
          # a shallow clone rather than believing it, so this line is what keeps CI green.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        # r29+ aligns native segments to 16 KB, which Google Play requires.
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Lint
        run: ./gradlew ktlintCheck detekt

      # `test` reaches every Android module and none of the multiplatform ones: a KMP
      # module has jvmTest and iosSimulatorArm64Test and no task called test, so
      # :core:common's tiers had never run here. jvmTest is the half a Linux runner can do.
      - name: Unit tests
        run: ./gradlew test jvmTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # Under the flavour directories since the runtime split; the old path matched
      # nothing, and upload-artifact's default is to warn about that and pass.
      - uses: actions/upload-artifact@v4
        with:
          name: openweights-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
