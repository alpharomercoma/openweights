# Project overrides on top of detekt's default config.
#
# The theme here is Compose: detekt's defaults predate it and flag idiomatic Compose as
# violations. Everything switched off below is switched off because the rule is wrong for
# this codebase, not because the code needs fixing.

naming:
  FunctionNaming:
    # Composables are PascalCase by convention, and Android Studio tooling depends on it.
    ignoreAnnotated: ['Composable']
    # Detekt's defaults exclude test source sets by path, and its list predates
    # multiplatform: it knows **/test/** and **/commonTest/** and not the source sets a KMP
    # module actually has. Overriding `excludes` replaces the default list rather than
    # adding to it, so the defaults are repeated here and the two new ones appended.
    # Without this, converting one module to KMP turned 10 findings into 193 overnight,
    # every one of them a backtick test name or a number in a fixture.
    excludes: &testSourceSets
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      # The AGP multiplatform plugin's own name for a module's host tests.
      - '**/androidHostTest/**'
      # This project's intermediate source set: tests shared by the JVM and Android.
      - '**/jvmAndAndroidTest/**'

  MatchingDeclarationName:
    # Theme.kt legitimately holds ThemeMode, the theme composable, and its CompositionLocal.
    active: false

style:
  MagicNumber:
    excludes: *testSourceSets
    # Colour literals, dp/sp sizes, and animation durations are the numbers. Naming each
    # one produces a wall of constants that says less than the call site did.
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    # An enum entry's arguments are the definition of the constant, not a magic use of
    # one. GgufFileType's ids are llama.cpp's own ftype numbers.
    ignoreEnums: true
  UnusedPrivateMember:
    # @Preview functions are entry points for tooling, never called from code.
    ignoreAnnotated: ['Preview', 'Composable']
  ReturnCount:
    max: 4

complexity:
  LongParameterList:
    # The JNI bridge mirrors native signatures one-to-one; bundling them into objects would
    # mean marshalling those objects across JNI, which is slower and more code.
    functionThreshold: 12
    constructorThreshold: 8
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotated: ['Composable']
    # A view model that owns one screen ends up with one function per user action plus a
    # few private helpers. Splitting that to satisfy a counter scatters cohesive logic.
    #
    # Raised from 15 to 18 in 2026-08 when agent modes and tool approval each added an
    # action to the chat screen. The check that matters is LongParameterList below, which
    # counts collaborators rather than user actions: it caught this same class doing too
    # much twice, and both times the fix was a real extraction (TurnRunner, ModelRuntime)
    # rather than a threshold.
    thresholdInClasses: 18
    ignorePrivate: true

exceptions:
  TooGenericExceptionCaught:
    active: false
